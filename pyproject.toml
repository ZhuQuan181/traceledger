[project]
name = "flowlab"
version = "0.7.0"
description = "FlowLab - 流量异常检测研究/实验工作台"
requires-python = ">=3.11"
dependencies = [
  "pandas>=3.1.1",
  "numpy>=2.4.6",
  "scikit-learn>=1.9.1",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "httpx2>=2.16"]
api = ["fastapi>=0.162.4", "uvicorn>=0.54.0", "python-multipart>=0.0.33"]
data = ["pyarrow>=26.0.1", "openpyxl>=3.1.5", "xlrd>=2.0.2"]

[project.scripts]
flowlab = "flowlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowlab"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src/flowlab",
  "/web/dist",
  "/hatch_build.py",
  "/pyproject.toml",
  "/README.md",
  "/README.en.md",
  "/LICENSE",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "node_modules", "web/node_modules", "web/dist", "dist", "site", "screens"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "S110"]
