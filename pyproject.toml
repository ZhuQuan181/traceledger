[project]
name = "flowlab"
version = "0.6.0"
description = "FlowLab - 流量异常检测研究/实验工作台"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "httpx2>=2.16"]
api = ["fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.12"]
data = ["pyarrow>=15", "openpyxl>=3.1", "xlrd>=2.0"]

[project.scripts]
flowlab = "flowlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowlab"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "flowlab/web"

[tool.hatch.build.targets.sdist]
include = [
  "/src/flowlab",
  "/web/dist",
  "/pyproject.toml",
  "/README.md",
  "/README.en.md",
  "/LICENSE",
]

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "node_modules", "web/node_modules", "web/dist", "dist", "site", "screens"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "S110"]
