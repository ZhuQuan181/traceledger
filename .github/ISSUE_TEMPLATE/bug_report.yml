name: Bug report
description: Report a reproducible defect in FlowLab
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove sensitive traffic, labels, and local paths before submitting.
  - type: input
    id: version
    attributes:
      label: FlowLab version
      placeholder: v0.7.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04 / Python 3.13 / Node 22
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal command, input shape, and relevant run ID or fingerprint.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the traceback or a screenshot if useful.
    validations:
      required: true
